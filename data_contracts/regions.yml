  - {name: region_name, type: string, required: true, nullable: false, description: "Official Moroccan region name"}
  - {name: demand_weight, type: number, required: true, nullable: false, description: "Normalised demand weight in [0, 1]"}
quality:
  # Enforced by the Great Expectations bronze gate (Phase 06); not checked in Phase 04.
  declared:
    - "region_id is unique and not null"
    - "demand_weight is between 0 and 1"
sla:
  consumers: [bronze, staging]