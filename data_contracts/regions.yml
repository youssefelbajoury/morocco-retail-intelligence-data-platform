id: regions
version: 1.0.0
owner: synthetic-generator
source: "mri.synthetic generator (apps.data_generator)"
description: "Moroccan regions with normalised demand weights."
format:
  types: [csv, json]
  encoding: utf-8
  delimiter: ","
keys:
  primary: [region_id]
  business: []
freshness:
  frequency: static
  max_age: null
volume:
  min_rows: 1
  max_rows: null
columns:
