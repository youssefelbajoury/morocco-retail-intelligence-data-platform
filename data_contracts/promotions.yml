# ---------------------------------------------------------------------------
# Data contract: promotions
# Produced by the deterministic synthetic generator (apps.data_generator).
# ---------------------------------------------------------------------------
id: promotions
version: 1.0.0
owner: synthetic-generator
source: "mri.synthetic generator (apps.data_generator)"
description: "Product promotions with optional region/channel scope and a date window."
format:
  types: [csv, json]
  encoding: utf-8
  delimiter: ","
keys:
  primary: [promotion_id]
  business: []
freshness:
  frequency: static
  max_age: null
volume:
  min_rows: 1
  max_rows: null
columns:
  - {name: promotion_id, type: string, required: true, nullable: false, description: "Promotion code, e.g. PM0001"}
  - {name: product_id, type: string, required: true, nullable: false, description: "FK -> products.product_id"}
  - {name: region_id, type: string, required: false, nullable: true, description: "Optional FK -> regions.region_id (null = all regions)"}
  - {name: channel_id, type: string, required: false, nullable: true, description: "Optional FK -> channels.channel_id (null = all channels)"}
  - {name: promotion_type, type: string, required: true, nullable: false, description: "One of: remise, prix_promo, bogo, fidelite, bundle"}
  - {name: discount_pct, type: number, required: true, nullable: false, description: "Discount ratio in [0, 1]"}
  - {name: start_date, type: date, required: true, nullable: false, description: "Start date (ISO-8601 yyyy-mm-dd)"}
  - {name: end_date, type: date, required: true, nullable: false, description: "End date (ISO-8601 yyyy-mm-dd)"}
quality:
  # Enforced by the Great Expectations bronze gate (Phase 06); not checked in Phase 04.
  declared:
    - "promotion_id is unique and not null"
    - "discount_pct between 0 and 1"
    - "end_date >= start_date"
    - "product_id exists in products"
sla:
  consumers: [bronze, staging]