name: mri
version: "1.0.0"
config-version: 2

profile: mri
require-dbt-version: [">=1.12.0", "<2.0.0"]

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

vars:
  # Silver source schema (override per run: --vars '{silver_schema: silver_it1234}')
  silver_schema: silver
  # Python-built Phase 09 star schema used by the parity test
  warehouse_schema: warehouse
  # Appended to every custom model schema (override for throwaway runs)
  schema_suffix: ""

models:
  mri:
    staging:
      +materialized: view
      +schema: dbt_staging
    intermediate:
      +materialized: view
      +schema: dbt_intermediate
    marts:
      +materialized: table
      +schema: dbt_marts

snapshots:
  mri:
    +schema: dbt_snapshots

tests:
  mri:
    +store_failures: false
