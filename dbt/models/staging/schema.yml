version: 2

models:
  - name: stg_sales
    description: Normalized sale line items from `silver.sales` (trimmed identifiers, explicit types).
    columns:
      - name: sale_id
        tests:
          - unique
          - not_null
      - name: store_id
        tests:
          - not_null
      - name: channel_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: sale_date
        tests:
          - not_null

  - name: stg_purchases
    description: Normalized purchase receipt lines from `silver.purchases`.
    columns:
      - name: purchase_id
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - not_null

  - name: stg_inventory
    description: Normalized stock snapshots from `silver.inventory`.
    columns:
      - name: store_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: snapshot_date
        tests:
          - not_null

  - name: stg_customers
    description: Normalized customers from `silver.customers`.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: region_id
        tests:
          - not_null
      - name: preferred_channel_id
        tests:
          - not_null

  - name: stg_products
    description: Normalized products from `silver.products`; the tracked attributes of the SCD2 dimension.
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: launch_date
        tests:
          - not_null

  - name: stg_promotions
    description: Normalized promotions from `silver.promotions`.
    columns:
      - name: promotion_id
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - not_null

  - name: stg_calendar
    description: Normalized project calendar from `silver.calendar` (holiday/Ramadan flags included).
    columns:
      - name: date
        tests:
          - unique
          - not_null

  - name: stg_regions
    description: Normalized regions from `silver.regions`.
    columns:
      - name: region_id
        tests:
          - unique
          - not_null

  - name: stg_channels
    description: Normalized sales channels from `silver.channels`.
    columns:
      - name: channel_id
        tests:
          - unique
          - not_null
      - name: channel_type
        tests:
          - accepted_values:
              arguments:
                values: ["physical", "digital"]

  - name: stg_stores
    description: Normalized stores from `silver.stores`.
    columns:
      - name: store_id
        tests:
          - unique
          - not_null
      - name: region_id
        tests:
          - not_null
