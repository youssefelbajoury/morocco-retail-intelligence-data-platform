# Morocco Retail Intelligence Data Platform — local container foundation.
#
# PHASE 03: ONLY PostgreSQL and MinIO. Airflow, Superset, dbt, Great
# Expectations and any business schema are intentionally out of scope.
#
# Usage (run from the repository root; --env-file points Compose at the root
# `.env`, since the Compose project directory defaults to THIS folder):
#   docker compose --env-file .env -f infrastructure/docker/docker-compose.yml config
#   docker compose --env-file .env -f infrastructure/docker/docker-compose.yml up -d
#   docker compose --env-file .env -f infrastructure/docker/docker-compose.yml ps
#   docker compose --env-file .env -f infrastructure/docker/docker-compose.yml down
#
# Host vs container addressing:
#   Postgres  host localhost:5433   container postgres:5432
#   MinIO     host localhost:9000   container minio:9000
#   MinIO UI  host localhost:9001   container minio:9001
#
# All credentials come from environment variables (`.env`); none are inlined.

name: mri

services:
  postgres:
    image: postgres:16-alpine
    container_name: mri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Data-page checksums catch silent on-disk corruption early.
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Keep PGDATA in a subdirectory so the volume mount stays a clean mount point.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mri
    healthcheck:
      # pg_isready reports readiness only when the server accepts connections.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    # Pinned official MinIO community release (NOT `latest`). See
    # docs/decisions/ADR-001-local-container-foundation.md for the registry
    # availability caveat around this image.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: mri-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - mri
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
    name: mri-postgres-data
  minio_data:
    name: mri-minio-data

networks:
  mri:
    name: mri-net
    driver: bridge