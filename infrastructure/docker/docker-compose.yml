# Morocco Retail Intelligence Data Platform — local container foundation.
#
# PHASE 03: ONLY PostgreSQL and MinIO live here. Great Expectations, dbt and
# any business schema are intentionally out of scope. Apache Airflow is
# layered on top by PHASE 11 in docker-compose.airflow.yml — pass both files
# in one project to run the orchestration stack:
#
#   docker compose --env-file .env \
#     -f infrastructure/docker/docker-compose.yml \
#     -f infrastructure/docker/docker-compose.airflow.yml up -d
#
# Usage (run from the repository root; --env-file points Compose at the root
# `.env`, since the Compose project directory defaults to THIS folder):
#   docker compose --env-file .env -f infrastructure/docker/docker-compose.yml config
#   docker compose --env-file .env -f infrastructure/docker/docker-compose.yml up -d
#   docker compose --env-file .env -f infrastructure/docker/docker-compose.yml ps
#   docker compose --env-file .env -f infrastructure/docker/docker-compose.yml down
#
# Host vs container addressing:
#   Postgres  host localhost:5433   container postgres:5432
#   MinIO     host localhost:9000   container minio:9000
#   MinIO UI  host localhost:9001   container minio:9001
#
# All credentials come from environment variables (`.env`); none are inlined.

name: mri

services:
  postgres:
    image: postgres:16-alpine
    container_name: mri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Data-page checksums catch silent on-disk corruption early.
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Keep PGDATA in a subdirectory so the volume mount stays a clean mount point.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Host-local only: bind to the loopback address so these ports are NOT
      # reachable from the LAN (see docs/security/security-hardening.md).
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mri
    healthcheck:
      # pg_isready reports readiness only when the server accepts connections.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    # Maintained, pullable MinIO distribution (see
    # docs/decisions/ADR-001-local-container-foundation.md). MinIO stopped
    # publishing Docker images (community edition is now source-only; Docker
    # Hub and Quay tags are gone as of 2026-10). Chainguard rebuilds the
    # current source (RELEASE.2026-09-22T19-25-18Z, post CVE-2025-62506);
    # digest-pinned for reproducibility.
    image: cgr.dev/chainguard/minio@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
    container_name: mri-minio
    restart: unless-stopped
    # The Chainguard image defaults to non-root UID 65532; keep root so the
    # pre-existing root-owned named volume stays writable (same as the old
    # image). See docs/security/security-hardening.md.
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      # Host-local only (loopback) — see docs/security/security-hardening.md.
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - mri
    healthcheck:
      # The Chainguard image has no curl/wget; /bin/sh -> bash, so use a bash
      # /dev/tcp connect probe against the S3 port (binds only after the
      # server has initialised). HTTP /minio/health/live is exercised by the
      # integration tests after boot instead.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
    name: mri-postgres-data
  minio_data:
    name: mri-minio-data

networks:
  mri:
    name: mri-net
    driver: bridge