# Morocco Retail Intelligence — Apache Superset BI layer (PHASE 12).
#
# Extends the base stack (infrastructure/docker/docker-compose.yml) with the
# project's Superset 6.1.0 image — the official image plus the PostgreSQL
# driver added by infrastructure/docker/Dockerfile.superset (the stock image
# ships without one). ALWAYS pass BOTH files in one project from the
# repository root:
#
#   docker compose --env-file .env \
#     -f infrastructure/docker/docker-compose.yml \
#     -f infrastructure/docker/docker-compose.superset.yml up -d
#
# Architecture — lightest local deployment, documented in docs/bi/superset.md
# and ADR-010:
#
#   superset-init   one-shot: metadata migrations + admin user + roles/perms
#   superset        single web server (UI + REST API on :8088), SQLite metadata
#
# Deliberately NOT included: Redis, a PostgreSQL metadata database, Celery
# workers/beat and example dashboards — none are required for a single-user
# local BI deployment. Superset's metadata lives in SQLite inside the named
# volume `superset_home`; the warehouse connection uses the READ-ONLY
# `BI_READER_*` role (grants: infrastructure/sql/bi-reader-readonly.sql).
#
# Everything runs on the shared `mri-net` network and reaches the retail
# warehouse by SERVICE NAME `postgres` (never localhost). Credentials come
# exclusively from the root `.env`; nothing is inlined here.

x-superset-common: &superset-common
  build:
    context: ../..
    dockerfile: infrastructure/docker/Dockerfile.superset
  image: mri-superset:6.1.0
  environment: &superset-common-env
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
    SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    SUPERSET_LOAD_EXAMPLES: "no"
    PYTHONUNBUFFERED: "1"
    # In-network addresses used by seed/validation tooling (never localhost).
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  volumes:
    - superset_home:/app/superset_home
  networks:
    - mri

services:
  superset-init:
    <<: *superset-common
    container_name: mri-superset-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        echo "Applying Superset metadata migrations..."
        superset db upgrade
        if superset fab list-users 2>/dev/null | grep -qw "$${SUPERSET_ADMIN_USER}"; then
          echo "Admin user '$${SUPERSET_ADMIN_USER}' already exists — skipping creation."
        else
          echo "Creating admin user '$${SUPERSET_ADMIN_USER}'..."
          superset fab create-admin \
            --username "$${SUPERSET_ADMIN_USER}" \
            --firstname MRI \
            --lastname Admin \
            --email "admin@mri.local" \
            --password "$${SUPERSET_ADMIN_PASSWORD}"
        fi
        echo "Syncing roles and permissions..."
        superset init
        echo "Superset init complete."
    restart: "no"

  superset:
    <<: *superset-common
    container_name: mri-superset
    restart: unless-stopped
    ports:
      # Host-local only (loopback) — see docs/security/security-hardening.md.
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD-SHELL", "/app/docker/docker-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully

volumes:
  superset_home:
    name: mri-superset-home

networks:
  mri:
    name: mri-net
    driver: bridge
